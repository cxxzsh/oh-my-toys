<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>oh-my-toys</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--bg-window); color:var(--text-primary); font-family:var(--font-display); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .orange { fill:var(--cat-orange); } .blue { fill:var(--cat-blue); } .purple { fill:var(--cat-purple); }
  .ink { fill:var(--text-primary); } .tint { fill:var(--fill-control); } .cut { fill:var(--bg-window); }
  .blk { rx:var(--radius-xl); } .toy { rx:var(--radius-icon-md); }
  .words { position:absolute; left:var(--space-10); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:104px; line-height:.94; font-weight:700; letter-spacing:-.03em; }
  .tag { margin:var(--space-3) 0 0 4px; font-family:var(--font-sans); font-size:14px; line-height:20px; color:var(--text-secondary); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="480 0 480 288" width="480" height="288">
<!--
  blocks      tool-orange 104 · tool-blue 224x104 and 104 · tool-purple 104x224 · text-primary 224x104 and 104 · fill-control 104 (x3) — a 4x3 grid of icon tiles, about 45% of 960x288
  arrangement a flush modular grid bled off the top and right, like the home page's tool cards, some merged two-wide or two-tall
  pattern     tiles cut by the radius tokens, from "a toolbox: every tool is a coloured squircle tile": 2x2 sets of 28px squircles (icon-md, radius-icon-md) cut in the ground out of the ink blocks, echoing the app mark's four toys
  scales      tile 104 = space-8 x 3 + space-2; gutters space-4; corners radius-xl (blocks), radius-icon-md (cut tiles)
-->
<rect class="orange blk" x="496" y="-56" width="104" height="104" rx="16"/>
<rect class="tint blk" x="616" y="-56" width="104" height="104" rx="16"/>
<rect class="ink blk" x="736" y="-56" width="224" height="104" rx="16"/>
<rect class="blue blk" x="496" y="64" width="224" height="104" rx="16"/>
<rect class="purple blk" x="736" y="64" width="104" height="224" rx="16"/>
<rect class="tint blk" x="856" y="64" width="104" height="104" rx="16"/>
<rect class="tint blk" x="496" y="184" width="104" height="104" rx="16"/>
<rect class="ink blk" x="616" y="184" width="104" height="104" rx="16"/>
<rect class="blue blk" x="856" y="184" width="104" height="104" rx="16"/>
<rect class="cut toy" x="812" y="-40" width="28" height="28" rx="7"/>
<rect class="cut toy" x="812" y="4" width="28" height="28" rx="7"/>
<rect class="cut toy" x="856" y="-40" width="28" height="28" rx="7"/>
<rect class="cut toy" x="856" y="4" width="28" height="28" rx="7"/>
<rect class="cut toy" x="632" y="200" width="28" height="28" rx="7"/>
<rect class="cut toy" x="632" y="244" width="28" height="28" rx="7"/>
<rect class="cut toy" x="676" y="200" width="28" height="28" rx="7"/>
<rect class="cut toy" x="676" y="244" width="28" height="28" rx="7"/>
</svg>
</div>
<div class="words">
<h1 class="name">oh-my-<br>toys</h1>
<p class="tag">一盒顺手的小工具，Mac 和 Windows 都能用。</p>
</div>
</div>
</body>
</html>
