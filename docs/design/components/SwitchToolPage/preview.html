<div class="main"><div class="toolbar"><span class="title">防睡眠</span></div>
<div class="content">
<div class="th"><span class="ti l orange"><svg class="g" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /> <path d="M12 2v2" /> <path d="M12 20v2" /> <path d="m4.93 4.93 1.41 1.41" /> <path d="m17.66 17.66 1.41 1.41" /> <path d="M2 12h2" /> <path d="M20 12h2" /> <path d="m6.34 17.66-1.41 1.41" /> <path d="m19.07 4.93-1.41 1.41" /></svg></span><div class="grow"><h1 class="large-title">防睡眠</h1><p class="desc">让电脑保持清醒，不会因为空闲而睡眠。</p></div><span class="pill on"><span class="dot"></span>运行中</span><button class="sw" role="switch" aria-checked="true" aria-label="防睡眠"></button></div>
<div class="mts" style="grid-template-columns:repeat(2,1fr)">
<div class="card mt"><span class="eyebrow">剩余时间</span><div class="mt-val"><span class="numeric-xl num">2:29:10</span></div><span class="mt-sub">到 21:32 自动关闭</span></div>
<div class="card mt"><span class="eyebrow">屏幕</span><div class="mt-val"><span class="numeric-xl">常亮</span></div><span class="mt-sub">屏幕不会自动关闭</span></div></div>
<div><p class="eyebrow group-title">时长</p><div class="card list"><div class="list-row"><div class="seg" role="group" aria-label="时长"><button aria-pressed="false">不限</button><button aria-pressed="false">30 分钟</button><button aria-pressed="false">1 小时</button><button aria-pressed="true">2 小时</button><button aria-pressed="false">4 小时</button><button aria-pressed="false">8 小时</button></div></div></div></div>
<div><p class="eyebrow group-title">设置</p><div class="card list">
<div class="list-row"><svg class="g" viewBox="0 0 24 24" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2" /> <line x1="8" x2="16" y1="21" y2="21" /> <line x1="12" x2="12" y1="17" y2="21" /></svg><div class="grow"><p class="headline">同时保持屏幕常亮</p><p class="desc">屏幕不会因为空闲而自动关闭</p></div><button class="sw" role="switch" aria-checked="true" aria-label="同时保持屏幕常亮"></button></div>
<div class="list-row"><svg class="g" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v10" /> <path d="M18.4 6.6a9 9 0 1 1-12.77.04" /></svg><div class="grow"><p class="headline">拔掉电源时自动关闭</p><p class="desc">用电池时恢复正常睡眠，省电</p></div><button class="sw" role="switch" aria-checked="false" aria-label="拔掉电源时自动关闭"></button></div></div></div>
</div></div></div></div>
<script>
document.querySelectorAll('.sw').forEach(function (s) { s.addEventListener('click', function () { s.setAttribute('aria-checked', s.getAttribute('aria-checked') !== 'true'); }); });
document.querySelectorAll('.seg').forEach(function (g) { var bs = g.querySelectorAll('button'); bs.forEach(function (b) { b.addEventListener('click', function () { bs.forEach(function (o) { o.setAttribute('aria-pressed', o === b); }); }); }); });
</script>
