name: CI

on:
  pull_request:
    # A draft runs nothing, so a work in progress costs no runner. A newer
    # push cancels the run of the older one below.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned: a new release of a tool must not turn a green branch red.
  GOLANGCI_LINT_VERSION: v2.15.0
  GOFUMPT_VERSION: v0.12.0
  GOIMPORTS_VERSION: v0.52.0
  GO_LICENSES_VERSION: v2.0.1
  LOCAL_PREFIX: github.com/cxxzsh/oh-my-toys
  # CONTRIBUTING.md section 3. github.com/go-text/typesetting is dual licensed
  # Unlicense or BSD-3-Clause; we use it under the BSD-3-Clause.
  ALLOWED_LICENSES: MIT,BSD-2-Clause,BSD-3-Clause,Apache-2.0,ISC,MPL-2.0
  IGNORED_MODULES: github.com/go-text/typesetting

jobs:
  lint:
    name: Lint (${{ matrix.goos }})
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The per-OS code under internal/platform is split by build tags, so
        # each OS is linted on its own.
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofumpt and goimports
        if: matrix.goos == 'linux'
        run: |
          unformatted=$(
            go run "mvdan.cc/gofumpt@$GOFUMPT_VERSION" -l .
            go run "golang.org/x/tools/cmd/goimports@$GOIMPORTS_VERSION" -local "$LOCAL_PREFIX" -l .
          )
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not formatted; run gofumpt and goimports:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        env:
          GOOS: ${{ matrix.goos }}
          CGO_ENABLED: "0"
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          args: ./...

  test:
    name: Test (${{ matrix.os }})
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The race detector needs cgo; the code itself builds without it.
      - name: Test with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...
      - name: Test as shipped, without cgo
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  # The platform packages are unit tested against fake command runners. This
  # job runs the live tests, which change the runner's own system proxy,
  # trust store and network capture, on the two systems that have no
  # developer machine in the loop. macOS asks for an administrator password
  # that a runner cannot give, so it was checked by hand instead.
  live:
    name: Live (${{ matrix.os }})
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, windows]
    env:
      CGO_ENABLED: "0"
      OMT_LIVE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Windows asks the person to confirm a root certificate added to their
      # own store. The runner has a desktop and nobody at it, so a script
      # answers Yes, as a person would, while the tests run.
      - name: System proxy and trust store (current user)
        if: matrix.os == 'windows'
        run: |
          $approver = Start-Process -PassThru -WindowStyle Hidden -FilePath pwsh -ArgumentList '-NoProfile', '-File', '.github/scripts/approve-root-prompt.ps1' -RedirectStandardOutput approver.log
          go test -v -count=1 -timeout 2m -run TestLive ./internal/platform/sysproxy/ ./internal/platform/trust/
          $status = $LASTEXITCODE
          Stop-Process -Id $approver.Id -Force
          Get-Content approver.log
          exit $status
      # Root is needed to write the system trust store and to open a raw
      # socket, so these two tests are compiled first and the binary alone
      # runs under sudo.
      - name: Trust store and packet capture (root)
        if: matrix.os == 'ubuntu'
        run: |
          for pkg in trust pcap; do
            go test -c -o "$RUNNER_TEMP/$pkg.test" "./internal/platform/$pkg"
            (cd "internal/platform/$pkg" && sudo OMT_LIVE=1 "$RUNNER_TEMP/$pkg.test" -test.run TestLive -test.v -test.timeout 5m)
          done
      # gsettings keeps its values in dconf, which needs a session bus.
      - name: System proxy (gsettings)
        if: matrix.os == 'ubuntu'
        env:
          GSETTINGS_BACKEND: dconf
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus dconf-service dconf-gsettings-backend gsettings-desktop-schemas
          dbus-run-session -- go test -v -count=1 -timeout 5m -run TestLive ./internal/platform/sysproxy/

  # The real app, in a real window on each system, driven the way a screen
  # reader drives it (MyGo's automation plugin, build tag e2e). The Traffic
  # scenario starts a capture, sends a request with the real curl, filters
  # the list and saves PNGs of the window, which the run uploads. Ubuntu has
  # no GPU and no display: Xvfb gives it a display and the UI draws in
  # software.
  e2e:
    name: E2E (${{ matrix.os }})
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos, windows, ubuntu]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Display and libraries
        if: matrix.os == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libx11-6 libxkbcommon0 libgl1 libegl1 mesa-vulkan-drivers libwayland-client0 libgtk-3-0
      - name: Build the app and the driver
        shell: bash
        run: |
          go build -tags e2e -o omt-e2e ./cmd/oh-my-toys
          go build -o e2e-driver ./dev/e2e
      # The app reads its settings from a folder of its own, so the capture
      # starts with the system proxy and decryption off and never touches the
      # runner's network.
      - name: Run the app and the scenarios
        shell: bash
        run: |
          set -eu
          mkdir -p shots
          case "${{ matrix.os }}" in
            macos)
              home="$RUNNER_TEMP/home"
              root="$home/Library/Application Support"
              sock="$RUNNER_TEMP/omt.sock"
              appenv="HOME=$home"
              ;;
            ubuntu)
              root="$RUNNER_TEMP/cfg"
              sock="$RUNNER_TEMP/omt.sock"
              appenv="XDG_CONFIG_HOME=$root"
              ;;
            windows)
              root="$(cygpath -w "$RUNNER_TEMP")\\appdata"
              sock="$(cygpath -m "$RUNNER_TEMP")/omt.sock"
              appenv="APPDATA=$root"
              ;;
          esac
          mkdir -p "$root"
          ./e2e-driver -prepare "$root"
          launch=""
          if [ "${{ matrix.os }}" = ubuntu ]; then launch="xvfb-run -a"; fi
          env "$appenv" MYGO_AUTOMATION="$sock" $launch ./omt-e2e > app.log 2>&1 &
          sleep 8
          status=0
          ./e2e-driver -socket "$sock" -out e2e-result.json -shots shots || status=$?
          cat e2e-result.json || true
          tail -30 app.log || true
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.os }}
          path: |
            shots
            e2e-result.json
            app.log
          if-no-files-found: ignore
          retention-days: 3

  build:
    name: Build
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cross-build every program for every platform
        shell: bash
        run: |
          for goos in darwin windows linux; do
            for goarch in amd64 arm64; do
              echo "::group::$goos/$goarch"
              GOOS=$goos GOARCH=$goarch go build ./...
              echo "::endgroup::"
            done
          done

  i18n:
    name: i18n
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the catalogs
        shell: bash
        run: |
          go tool mygo i18n check | tee i18n.log
          # `i18n check` exits 0 on warnings, which include a message that
          # zh-Hans lacks; here they fail the build.
          if grep -q 'warning:' i18n.log; then
            exit 1
          fi
      - name: Check the generated code is up to date
        run: |
          go tool mygo generate
          go generate ./internal/ui/ds
          git diff --exit-code -- internal

  licences:
    name: Licences
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install go-licenses
        run: GOBIN="$RUNNER_TEMP/bin" go install "github.com/google/go-licenses/v2@$GO_LICENSES_VERSION"
      - name: Check the licences of the dependencies of every OS
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          for goos in linux darwin windows; do
            echo "::group::$goos"
            GOOS=$goos "$RUNNER_TEMP/bin/go-licenses" check ./... \
              --allowed_licenses="$ALLOWED_LICENSES" \
              --ignore "$IGNORED_MODULES"
            echo "::endgroup::"
          done
