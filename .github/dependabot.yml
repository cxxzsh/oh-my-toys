version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    groups:
      # MyGo is pinned to an exact version and upgraded in a pull request of
      # its own (CONTRIBUTING.md section 3), so it stays out of the group.
      go-modules:
        patterns: ["*"]
        exclude-patterns: ["github.com/egoist/mygo"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
